name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate FS25_AutoDrive.zip
        run: python tools/make_release.py

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: FS25_AutoDrive.zip
